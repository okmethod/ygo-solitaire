id: exodia-deck
name: 封印されしエクゾディア
description: 魔法カード主体のエクゾディアデッキです
category: エクゾディア
guide: |
  勝利条件: 手札に封印されしエクゾディア・右腕・左腕・右足・左足の5枚を揃える。
  基本方針: 強欲な壺・成金ゴブリン・天使の施し・無の煉獄などのドローカードを連打して5枚を揃える。
  チキンレース: テラ・フォーミングでサーチして発動し、LP差をつけながらドロー源にする。
  手札断殺: 手札を2枚捨てて2枚ドロー。エクゾパーツ以外を整理しながらドロー枚数を稼ぐ。
  魔法石の採掘: 手札を2枚捨てて墓地の魔法カードを回収しドローソースを使い回す。
