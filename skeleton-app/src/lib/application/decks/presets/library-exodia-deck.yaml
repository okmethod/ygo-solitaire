id: library-exodia-deck
name: 図書館エクゾ
description: 王立魔法図書館に魔力カウンターに置いてドローするエクゾディアデッキです
category: エクゾディア
guide: |
  勝利条件: 手札に封印されしエクゾディア5枚を揃える。
  王立魔法図書館: フィールドに維持し魔法カードを発動するたびに魔力カウンターを1個乗せ、3個で起動効果1枚ドロー。複数体並べると加速する。
  召喚僧サモンプリースト: 手札の魔法カードをコストに手放しでデッキからレベル4モンスター（王立魔法図書館）を特殊召喚。
  テラ・フォーミング→チキンレース: フィールド魔法を安定して初動に引き込む。
  トゥーンのもくじ→トゥーン・ワールド: 連鎖サーチで魔力カウンターを一気に積み上げる。
  折れ竹光・黄金色の竹光: 装備魔法の連打で魔力カウンターを稼ぐ。
  基本方針: 図書館を素早くフィールドに複数並べ、魔法連打で魔力カウンターを貯め、フリードローでパーツを集める。
