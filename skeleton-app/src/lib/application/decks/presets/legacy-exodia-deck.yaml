id: legacy-exodia-deck
name: レガシー・エクゾディア
description: 往年のクリッター・黒き森のウィッチを使えるエクゾディアデッキです
category: エクゾディア
guide: |
  勝利条件: 手札に封印されしエクゾディア5枚を揃える。
  クリッター[L]: 墓地へ送られると攻撃力1500以下のモンスター1枚をデッキからサーチ。エクゾパーツをサーチする主力。
  黒き森のウィッチ[L]: 墓地へ送られると守備力1500以下のモンスター1枚をサーチ。クリッターと合わせてサーチを重ねる。
  基本方針: ドローソースでクリッター・ウィッチを引き込み、効果でエクゾパーツをサーチしつつ5枚を揃える。
