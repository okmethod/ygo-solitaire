id: panda-exodia-deck
name: パンダエクゾ
description: トレジャーパンダと通常モンスターを活用してドローするエクゾディアデッキです
category: エクゾディア
guide: |
  勝利条件: 手札に封印されしエクゾディア5枚を揃える。
  トレジャー・パンダ: 手札の魔法・罠を捨てデッキから通常モンスター3体を墓地へ送り自己特殊召喚。エクゾパーツをデッキから直接墓地に落としつつ場を埋める。
  召喚僧サモンプリースト: 手札の魔法カードをコストにトレジャー・パンダをリクルート。
  スペース・オマジナイ・ウサギ: レベル1通常モンスター。コスト要員兼ドロー補助。
  ワンダー・ワンド: 魔法使い族に装備し墓地送りで2枚ドロー。
  馬の骨の対価: 通常モンスター1体を墓地へ送り2枚ドロー。
  基本方針: パンダ+サモンプリーストでエクゾパーツを墓地に落としながらドロー、残ったパーツをフォーミュラ・シンクロン等のシンクロドローで手札に引き込む。
