id: scientist-catapult-deck
name: サイエンカタパ
description: 魔導サイエンティストで特殊召喚した融合モンスターを、カタパルトタートルで射出するデッキです
category: フルバーン
guide: |
  勝利条件: 相手LP8000を直接バーンダメージで0にする（戦闘なし）。
  魔導サイエンティスト: LP1000払いエクストラデッキのレベル6以下の融合モンスターを特殊召喚（攻守0、効果無効）。
  カタパルト・タートル[L]: 自分モンスターを1体リリースし攻撃力の半分のダメージを与える（起動効果）。
  コンボ: 魔導サイエンティストで融合モンスターを大量展開→カタパルトで射出→ダメージ8000超え。
  融合モンスター一覧: 紅陽鳥（攻2000）×3、アクア・ドラゴン（攻2250）×3、金色の魔象（攻1600）×3。
  計算例: 紅陽鳥×3=3000、アクア×3=3375、魔象×3=2400 → 合計8775ダメージ（コスト差し引き後）。
  補助カード: 混沌の黒魔術師[L]・トゥーン・キャノン・ソルジャーも射出要員。名推理・モンスターゲートで手早くサイエンティストを展開。
