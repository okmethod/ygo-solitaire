services:
  skeleton-app:
    image: node:22.14.0-slim
    ports:
      - 5173:5173
    working_dir: /app
    environment:
      LOCAL_API_BASE_URL: "https://multi-ai-gateway.okmethod2020.workers.dev"
      VITE_DEFAULT_LLM_PROVIDER: "gemini"
    volumes:
      - ./skeleton-app:/app
      - skeleton-app-node-modules:/app/node_modules
    command: /bin/sh -c "npm install && npm run dev"
  
volumes:
  skeleton-app-node-modules:
